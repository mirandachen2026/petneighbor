<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宠邻 PetNeighbor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%2268%2032%20114%20108%22%3E%3Ccircle%20cx%3D%22120%22%20cy%3D%2288%22%20r%3D%2248%22%20fill%3D%22%232a8a6e%22/%3E%3Cellipse%20cx%3D%2298%22%20cy%3D%2249%22%20rx%3D%2210%22%20ry%3D%2213%22%20fill%3D%22%232a8a6e%22/%3E%3Cellipse%20cx%3D%22142%22%20cy%3D%2249%22%20rx%3D%2210%22%20ry%3D%2213%22%20fill%3D%22%232a8a6e%22/%3E%3Cellipse%20cx%3D%2298%22%20cy%3D%2251%22%20rx%3D%226%22%20ry%3D%228%22%20fill%3D%22%23c95b4a%22/%3E%3Cellipse%20cx%3D%22142%22%20cy%3D%2251%22%20rx%3D%226%22%20ry%3D%228%22%20fill%3D%22%23c95b4a%22/%3E%3Ccircle%20cx%3D%22120%22%20cy%3D%2290%22%20r%3D%2234%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%22109%22%20cy%3D%2282%22%20r%3D%224%22%20fill%3D%22%231a2332%22/%3E%3Ccircle%20cx%3D%22131%22%20cy%3D%2282%22%20r%3D%224%22%20fill%3D%22%231a2332%22/%3E%3Ccircle%20cx%3D%22110.5%22%20cy%3D%2280.5%22%20r%3D%221.5%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%22132.5%22%20cy%3D%2280.5%22%20r%3D%221.5%22%20fill%3D%22%23fff%22/%3E%3Cellipse%20cx%3D%22120%22%20cy%3D%2291%22%20rx%3D%225%22%20ry%3D%223.5%22%20fill%3D%22%231a2332%22/%3E%3Cpath%20d%3D%22M115%2094%20Q120%2099%20125%2094%22%20stroke%3D%22%231a2332%22%20stroke-width%3D%221.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M154%20102%20C170%2096%20178%2080%20168%2068%20C160%2058%20148%2062%20150%2072%20C152%2080%20162%2078%20160%2088%20C158%2096%20150%2098%20148%20106%22%20stroke%3D%22%23c95b4a%22%20stroke-width%3D%224%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%22147%22%20cy%3D%22109%22%20r%3D%225%22%20fill%3D%22%23c95b4a%22/%3E%3C/svg%3E">
<style>
:root{
  --navy:#3d5068;--navy-d:#2c3e52;--navy-l:#eef1f5;--navy-ink:#3d5068;--navy-b:#b8c8d8;
  --coral:#c95b4a;--coral-l:#fdf0ee;--coral-ink:#8a3020;--coral-b:#f0c8c0;
  --teal:#2a8a6e;--teal-l:#e6f4ef;--teal-ll:#f2faf7;--teal-ink:#1a6a50;--teal-b:#c0d8d0;
  --amber-l:#fef4e0;--amber-ink:#8a6010;--amber-b:#f0d898;
  --warm:#f8f5f0;--white:#fff;
  --ink:#1a2332;--ink2:#4a5568;--ink3:#718096;--ink4:#a0aec0;
  --border:#e2e8f0;--border2:#cbd5e0;
  --r:10px;--r2:16px;--r3:24px;
  --s1:0 1px 3px rgba(0,0,0,.06);
  --s2:0 4px 16px rgba(0,0,0,.09);
  --s3:0 12px 40px rgba(0,0,0,.13);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy-l:#222c3a;--navy-ink:#a8bcd4;--navy-b:#3a4a60;
  --coral:#d06a58;--coral-l:#3a211d;--coral-ink:#f2a697;--coral-b:#5a322b;
  --teal:#2f977a;--teal-l:#153029;--teal-ll:#122822;--teal-ink:#86d6ba;--teal-b:#255446;
  --amber-l:#33290f;--amber-ink:#efc766;--amber-b:#5a4719;
  --warm:#12161d;--white:#1b212b;
  --ink:#e7ebf1;--ink2:#c2c9d4;--ink3:#96a0b0;--ink4:#6a7484;
  --border:#2b333f;--border2:#3a4452;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --navy-l:#222c3a;--navy-ink:#a8bcd4;--navy-b:#3a4a60;
  --coral:#d06a58;--coral-l:#3a211d;--coral-ink:#f2a697;--coral-b:#5a322b;
  --teal:#2f977a;--teal-l:#153029;--teal-ll:#122822;--teal-ink:#86d6ba;--teal-b:#255446;
  --amber-l:#33290f;--amber-ink:#efc766;--amber-b:#5a4719;
  --warm:#12161d;--white:#1b212b;
  --ink:#e7ebf1;--ink2:#c2c9d4;--ink3:#96a0b0;--ink4:#6a7484;
  --border:#2b333f;--border2:#3a4452;
  color-scheme:dark;
}
/* hero info card stays a light card on the navy hero in both themes */
.hero-card{--ink:#1a2332;--ink2:#4a5568;--ink3:#718096;--border:#e2e8f0;--navy-ink:#3d5068;--teal:#2a8a6e}
/* hosted-page safe areas */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans SC',sans-serif;color:var(--ink);background:var(--warm);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}

/* ══ TOPBAR ══ */
.topbar{background:var(--navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:200;box-shadow:0 2px 16px rgba(44,62,82,.25)}
.tb-top{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:0 32px;height:62px}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer;flex-shrink:0}
.logo-badge{width:44px;height:44px;border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.3);flex-shrink:0}
.logo-badge svg{width:22px;height:22px;fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.2px}
.logo-en{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.08em;font-weight:400}
.tb-tagline{font-size:12px;color:rgba(255,255,255,.4);flex:1;text-align:right;letter-spacing:.01em;padding-right:24px}
.tb-r{display:flex;gap:8px;align-items:center;flex-shrink:0}
.lang-sw{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:7px;overflow:hidden}
.lsb{padding:5px 12px;font-size:12px;font-weight:500;border:none;background:none;color:rgba(255,255,255,.55);transition:all .15s}
.lsb.on{background:rgba(255,255,255,.15);color:#fff}
.tbtn{padding:8px 22px;border-radius:99px;font-size:13px;font-weight:600;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;transition:all .15s;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6)}
.tbtn-p{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 4px 14px rgba(201,91,74,.35)}
.tbtn-p:hover{background:#b04a3a;border-color:#b04a3a}
.tb-nav{max-width:1280px;margin:0 auto;display:flex;padding:0 32px;border-top:1px solid rgba(255,255,255,.1)}
.tn{padding:12px 16px;font-size:13px;font-weight:500;color:rgba(255,255,255,.6);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:.01em;transition:all .15s}
.tn:hover{color:rgba(255,255,255,.9)}
.tn.on{color:#fff;border-bottom-color:rgba(255,255,255,.8)}

/* ══ PAGES ══ */
.page{display:none}.page.on{display:block}

/* ══ HERO ══ */
.hero{background:linear-gradient(100deg,var(--navy-d) 0%,var(--navy) 55%,#4a6280 100%);padding:80px 32px;position:relative;overflow:hidden;min-height:540px;display:flex;align-items:center}
.hero-pattern{position:absolute;inset:0;pointer-events:none;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-rule='evenodd'%3E%3Ccircle cx='30' cy='30' r='4'/%3E%3C/g%3E%3C/svg%3E");background-size:30px 30px}
.hero-glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.hg1{width:500px;height:500px;background:rgba(42,138,110,.35);top:-120px;left:-80px}
.hg2{width:300px;height:300px;background:rgba(201,91,74,.2);bottom:-60px;right:100px}
.hero-content{max-width:560px;position:relative;z-index:1}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:18px}
.hero-eyebrow svg{width:16px;height:16px;stroke:rgba(255,255,255,.7);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero h1{font-size:46px;font-weight:700;color:#fff;line-height:1.12;letter-spacing:-1.5px;margin-bottom:18px}
.hero h1 em{font-style:normal;color:#7dd3b5}
.hero-desc{font-size:16px;color:rgba(255,255,255,.65);line-height:1.8;margin-bottom:32px;max-width:460px}
.hero-btns{display:flex;flex-direction:column;gap:10px;max-width:300px}
.hbtn{display:flex;align-items:center;gap:10px;padding:13px 22px;border-radius:99px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .18s;letter-spacing:.01em}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hbtn-p{background:var(--coral);color:#fff;box-shadow:0 6px 20px rgba(201,91,74,.38)}
.hbtn-p:hover{background:#b04a3a;transform:translateY(-1px);box-shadow:0 8px 24px rgba(201,91,74,.45)}
.hbtn-s{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.3)}
.hbtn-s:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
/* hero right card */
.hero-card{position:absolute;right:6%;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.96);border-radius:20px;padding:24px;width:280px;box-shadow:var(--s3);z-index:2}
.hc-title{font-size:13px;font-weight:700;color:var(--navy-ink);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.hc-title svg{width:15px;height:15px;stroke:var(--teal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hc-stat{display:flex;justify-content:space-between;margin-bottom:14px}
.hcs{text-align:center}
.hcs-v{font-size:20px;font-weight:800;color:var(--navy-ink);letter-spacing:-.5px}
.hcs-l{font-size:11px;color:var(--ink3);margin-top:1px}
.hc-divider{height:1px;background:var(--border);margin-bottom:14px}
.hc-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.hc-row:last-child{margin-bottom:0}
.hc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hc-dot-g{background:var(--teal)}
.hc-dot-c{background:var(--coral)}
.hc-row-text{font-size:12px;color:var(--ink2);font-weight:500}

/* ══ TRUST STRIP ══ */
.tstrip{background:var(--white);border-bottom:1px solid var(--border)}
.tstrip-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:center}
.ts-item{display:flex;align-items:center;gap:10px;padding:18px 36px;border-right:1px solid var(--border)}
.ts-item:last-child{border-right:none}
.ts-ico{width:34px;height:34px;border-radius:9px;background:var(--teal-l);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ts-ico svg{width:16px;height:16px;stroke:var(--teal);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ts-val{font-size:18px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.4px}
.ts-lbl{font-size:11px;color:var(--ink3);margin-top:2px}

/* ══ SECTION ══ */
.wrap{max-width:1280px;margin:0 auto;padding:64px 32px}
.sh{margin-bottom:36px}
.sh-ey{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--teal);text-transform:uppercase;margin-bottom:8px}
.sh-t{font-size:30px;font-weight:700;letter-spacing:-.5px;color:var(--ink);line-height:1.2;margin-bottom:10px}
.sh-sub{font-size:15px;color:var(--ink3);line-height:1.75;max-width:560px}
.sh-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lk{font-size:13px;font-weight:600;color:var(--teal);cursor:pointer;border-bottom:1px solid transparent;transition:border-color .15s;padding-bottom:2px}
.lk:hover{border-bottom-color:var(--teal)}

/* ══ BENEFIT CARDS ══ */
.benefit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.bc{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);padding:22px;transition:box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.bc:hover{box-shadow:var(--s2);border-color:var(--border2)}
.bc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r2) var(--r2) 0 0}
.bc-teal::before{background:linear-gradient(90deg,var(--teal),#5ecda8)}
.bc-navy::before{background:linear-gradient(90deg,var(--navy),#6a8aaa)}
.bc-coral::before{background:linear-gradient(90deg,var(--coral),#e88a7a)}
.bc-amber::before{background:linear-gradient(90deg,#d4900a,#f0c040)}
.bc-slate::before{background:linear-gradient(90deg,#5a7a9a,#8aaac8)}
.bc-sage::before{background:linear-gradient(90deg,#4a8a6a,#80c0a0)}
.bc-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:13px}
.bc-ico svg{width:19px;height:19px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bc h3{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:5px;letter-spacing:-.1px}
.bc p{font-size:13px;color:var(--ink3);line-height:1.65}

/* ══ HIW ══ */
.hiw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.hiw-c{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);padding:22px;position:relative;overflow:hidden}
.hiw-c::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--navy))}
.hiw-n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--teal-l);color:var(--teal);font-size:12px;font-weight:800;margin-bottom:12px}
.hiw-c h3{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:5px}
.hiw-c p{font-size:13px;color:var(--ink3);line-height:1.65}

/* ══ FILTER BAR ══ */
.fbar{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:calc(106px + env(safe-area-inset-top,0px));z-index:100;box-shadow:var(--s1)}
.fbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;height:46px;padding:0 32px}
.fb{padding:0 15px;height:100%;font-size:13px;font-weight:500;color:var(--ink3);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.fb:hover{color:var(--ink2)}
.fb.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.fbar-r{margin-left:auto;display:flex;gap:8px}
.fsel{padding:6px 10px;border-radius:7px;border:1px solid var(--border2);font-size:12px;font-weight:500;color:var(--ink2);background:var(--white)}

/* ══ PROVIDER GRID ══ */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.pcard{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .2s,border-color .2s}
.pcard:hover{box-shadow:var(--s3);transform:translateY(-3px);border-color:var(--border2)}
.pc-head{height:110px;position:relative;display:flex;align-items:flex-end;padding:12px 14px;overflow:hidden}
.pch-sage{background:linear-gradient(155deg,#b4e8cc 0%,#def5e8 100%)}
.pch-slate{background:linear-gradient(155deg,#b8cce8 0%,#dde8f5 100%)}
.pch-amber{background:linear-gradient(155deg,#f0d8a8 0%,#faecd0 100%)}
.pch-rose{background:linear-gradient(155deg,#f0c4bc 0%,#fae0dc 100%)}
.pch-navy{background:linear-gradient(155deg,#c0ccd8 0%,#dde4ed 100%)}
.pch-teal{background:linear-gradient(155deg,#a8dcd8 0%,#d4f0ee 100%)}
.pc-head svg.illo{position:absolute;right:12px;top:8px;width:76px;height:76px;opacity:.25}
.pc-av{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;border:2.5px solid #fff;box-shadow:var(--s2);flex-shrink:0}
.av-teal{background:linear-gradient(135deg,var(--teal),#1e6e54)}
.av-navy{background:linear-gradient(135deg,var(--navy),var(--navy-d))}
.av-amber{background:linear-gradient(135deg,#d4900a,#a86c00)}
.av-coral{background:linear-gradient(135deg,var(--coral),#a04030)}
.av-slate{background:linear-gradient(135deg,#5a7a9a,#3a5a7a)}
.av-sage{background:linear-gradient(135deg,#4a8a6a,#2a6a4a)}
.pc-body{padding:15px}
.pc-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px}
.pc-name{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.vbadge{font-size:10px;font-weight:700;color:var(--teal);background:var(--teal-l);padding:2px 7px;border-radius:5px;letter-spacing:.04em}
.pc-loc{font-size:12px;color:var(--ink3);margin-top:1px}
.pc-rat{font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:3px;white-space:nowrap}
.star{color:#f5b800}
.rr{font-size:11px;color:var(--ink4);font-weight:400;margin-left:3px}
.pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:11px;font-weight:500;padding:3px 9px;border-radius:6px;border:1px solid var(--border);color:var(--ink2)}
.tag-t{background:var(--teal-l);border-color:var(--teal-b);color:var(--teal-ink)}
.tag-n{background:var(--navy-l);border-color:var(--navy-b);color:var(--navy-ink)}
.tag-a{background:var(--amber-l);border-color:var(--amber-b);color:var(--amber-ink)}
.pc-bio{font-size:13px;color:var(--ink3);line-height:1.65;margin-bottom:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:11px}
.pc-price{font-size:13px;color:var(--ink3)}
.pc-price strong{font-size:14px;font-weight:700;color:var(--ink)}
.pc-btns{display:flex;gap:6px}
.cb{padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--border2);background:var(--white);color:var(--ink2);transition:all .15s}
.cb:hover{background:var(--warm)}
.cb-p{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 10px rgba(42,138,110,.2)}
.cb-p:hover{background:#1e6e54}

/* ══ PROFILE ══ */
.prof-pg{max-width:900px;margin:0 auto;padding:28px 32px}
.prof-cover{height:130px;background:linear-gradient(135deg,var(--navy-d) 0%,var(--navy) 60%,#5a7a9a 100%);border-radius:var(--r2) var(--r2) 0 0;position:relative;overflow:hidden}
.prof-cover::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:30px 30px}
.prof-glow{position:absolute;width:250px;height:250px;border-radius:50%;filter:blur(56px);background:var(--teal);opacity:.25;top:-90px;right:80px}
.prof-av-wrap{position:absolute;bottom:-30px;left:26px}
.prof-av{width:64px;height:64px;border-radius:18px;border:3px solid var(--white);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--teal),#1e6e54);box-shadow:var(--s3)}
.prof-info{background:var(--white);border-radius:0 0 var(--r2) var(--r2);border:1px solid var(--border);border-top:none;padding:44px 26px 22px;margin-bottom:14px}
.prof-name{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.4px;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prof-meta{font-size:13px;color:var(--ink3);margin-bottom:11px;display:flex;gap:10px;flex-wrap:wrap}
.prof-sep{color:var(--border2)}
.prof-acts{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{padding:9px 20px;border-radius:99px;font-size:13px;font-weight:600;border:1.5px solid var(--border2);background:var(--white);color:var(--ink2);transition:all .15s}
.pbtn:hover{background:var(--warm)}
.pbtn-p{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 4px 14px rgba(42,138,110,.22)}
.pbtn-p:hover{background:#1e6e54}
.pbtn-o{border-color:var(--teal);color:var(--teal)}
.pbtn-o:hover{background:var(--teal-l)}
.prof-cols{display:grid;grid-template-columns:1fr 288px;gap:14px}
.pcard-w{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);padding:20px;margin-bottom:14px}
.pct{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.pct::before{content:'';width:3px;height:13px;background:var(--teal);border-radius:99px;flex-shrink:0}
.svc-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.si{padding:13px;border-radius:var(--r);border:1px solid var(--border);background:var(--warm)}
.si-n{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px}
.si-p{font-size:13px;color:var(--teal);font-weight:700}
.si-note{font-size:11px;color:var(--ink3);margin-top:3px}
.rc{background:linear-gradient(135deg,var(--teal-ll),var(--navy-l));border:1px solid var(--teal-b);border-radius:var(--r);padding:14px}
.rc-head{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.rc-desc{font-size:13px;color:var(--ink3);margin-bottom:9px;line-height:1.65}
.rc-nodes{display:flex;gap:5px;flex-wrap:wrap}
.rc-node{font-size:11px;font-weight:500;padding:3px 9px;border-radius:6px;background:var(--white);border:1px solid var(--border);color:var(--ink2)}
.cert-r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.cert-r:last-child{border-bottom:none}
.cert-dot{width:30px;height:30px;border-radius:9px;background:var(--teal-l);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cert-dot svg{width:14px;height:14px;stroke:var(--teal);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cert-v{margin-left:auto;font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-l);padding:3px 10px;border-radius:99px;white-space:nowrap}
.rply-bar{background:var(--warm);border-radius:9px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:8px;border:1px solid var(--border)}
.rply-track{flex:1;height:5px;border-radius:99px;background:var(--border2);overflow:hidden}
.rply-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#5ecda8)}
.rply-n{font-size:15px;font-weight:800;color:var(--teal);flex-shrink:0}
.rev-item{padding:13px;border-radius:var(--r);background:var(--warm);border:1px solid var(--border);margin-bottom:8px}
.rev-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.rev-author{font-size:13px;font-weight:600;color:var(--ink)}
.rev-stars{font-size:12px;color:#f5b800}
.rev-txt{font-size:13px;color:var(--ink3);line-height:1.65}
.pet-item{display:flex;gap:10px;padding:12px;border-radius:var(--r);border:1px solid var(--border);margin-bottom:8px;background:var(--warm)}
.pet-thumb{width:40px;height:40px;border-radius:11px;background:var(--white);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border)}
.pet-thumb svg{width:20px;height:20px;stroke:var(--ink3);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pet-n{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px}
.pet-i{font-size:12px;color:var(--ink3);line-height:1.5}
.pet-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.pchip{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--teal-l);color:var(--teal-ink)}
.pchip-w{background:var(--amber-l);color:var(--amber-ink)}

/* ══ QUIZ ══ */
.quiz-prog{display:flex;gap:4px;margin-bottom:16px}
.qp{height:3px;flex:1;border-radius:99px;background:var(--border)}
.qp.done{background:var(--teal)}
.qp.wrong{background:var(--coral)}
.quiz-score{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 14px;background:var(--warm);border-radius:var(--r);border:1px solid var(--border)}
.qs-label{font-size:13px;color:var(--ink2);flex:1}
.qs-val{font-size:15px;font-weight:800;color:var(--teal)}
.quiz-q{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:11px;line-height:1.65}
.quiz-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.qo{padding:10px 14px;border-radius:8px;border:1px solid var(--border2);font-size:13px;background:var(--white);color:var(--ink);text-align:left;transition:all .15s}
.qo:hover:not([disabled]){border-color:var(--teal);background:var(--teal-ll)}
.qo.correct{background:var(--teal-l);border-color:var(--teal);color:var(--teal-ink);font-weight:600}
.qo.wrong{background:var(--coral-l);border-color:var(--coral);color:var(--coral-ink);font-weight:600}
.quiz-explain{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.65;padding:8px 12px;background:var(--warm);border-radius:7px;border:1px solid var(--border)}
.quiz-fail{background:var(--coral-l);border:1.5px solid var(--coral);border-radius:var(--r2);padding:20px;text-align:center}
.quiz-fail-title{font-size:16px;font-weight:700;color:var(--coral);margin-bottom:6px}
.quiz-fail-desc{font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.65}

/* ══ TRUST ══ */
.trust-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-bottom:24px}
.lvl-row{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px}
.lvl-ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.lvl-n{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:1px}
.lvl-d{font-size:12px;color:var(--ink3)}
.lvl-r{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink4)}

/* ══ CHARITY ══ */
.fund-hdr{background:linear-gradient(135deg,var(--teal-ll),var(--navy-l));border-radius:var(--r2);padding:24px 28px;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;border:1px solid var(--teal-b);flex-wrap:wrap;gap:14px}
.fund-n{font-size:30px;font-weight:800;color:var(--teal);letter-spacing:-.5px}
.fund-l{font-size:13px;color:var(--teal-ink);margin-top:2px}
.fund-meta{font-size:13px;color:var(--ink3)}
.proj-card{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);padding:20px;margin-bottom:12px}
.proj-n{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px}
.proj-date{font-size:12px;color:var(--ink3);margin-bottom:9px}
.proj-desc{font-size:13px;color:var(--ink2);line-height:1.65;margin-bottom:12px}
.proj-bar{height:7px;background:var(--border);border-radius:99px;margin-bottom:6px;overflow:hidden}
.proj-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#5ecda8)}
.proj-lbls{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);font-weight:500}
.log-tbl{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);overflow:hidden}
.log-row{display:flex;align-items:center;gap:12px;padding:11px 18px;font-size:13px;border-bottom:1px solid var(--border)}
.log-row:last-child{border-bottom:none}
.log-date{color:var(--ink4);font-weight:600;min-width:46px;font-size:12px}
.log-desc{color:var(--ink2);flex:1}
.log-amt{color:var(--teal);font-weight:700}
.apply-card{background:linear-gradient(135deg,var(--teal-ll),var(--navy-l));border:1px solid var(--teal-b);border-radius:var(--r2);padding:24px;margin-top:20px}
.apply-card h3{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:6px}
.apply-card p{font-size:13px;color:var(--ink3);line-height:1.7;margin-bottom:16px}

/* ══ INSURANCE ══ */
.ins-plan{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);padding:18px 22px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;transition:box-shadow .15s}
.ins-plan:hover{box-shadow:var(--s2)}
.ins-n{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px;display:flex;align-items:center;gap:7px}
.ins-tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--teal-l);color:var(--teal);letter-spacing:.04em}
.ins-cov{font-size:12px;color:var(--ink3);margin-bottom:2px}
.ins-det{font-size:12px;color:var(--ink2)}
.ins-price{font-size:22px;font-weight:800;color:var(--teal);text-align:right;letter-spacing:-.3px}

/* ══ NOTICE ══ */
.notice{border-radius:var(--r2);padding:18px 22px;margin-bottom:26px;display:flex;align-items:flex-start;gap:14px}
.notice-teal{background:var(--teal-ll);border:1px solid var(--teal-b)}
.notice-ico{width:36px;height:36px;border-radius:10px;background:var(--teal-l);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.notice-ico svg{width:17px;height:17px;stroke:var(--teal);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.notice-t{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px}
.notice-d{font-size:13px;color:var(--ink3);line-height:1.65}

/* ══ SOS ══ */
.sos-bar{background:var(--coral-l);border:1px solid var(--coral-b);border-radius:var(--r2);padding:16px 20px;display:flex;align-items:center;gap:14px;margin-top:8px}
.sos-dot{width:9px;height:9px;border-radius:50%;background:var(--coral);flex-shrink:0}
.sos-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:2px}
.sos-desc{font-size:13px;color:var(--ink3)}
.sos-btn{margin-left:auto;padding:9px 20px;border-radius:99px;background:var(--coral);color:#fff;border:none;font-size:13px;font-weight:700;flex-shrink:0;letter-spacing:.01em;transition:background .15s;box-shadow:0 4px 12px rgba(201,91,74,.28)}
.sos-btn:hover{background:#a04030}

/* ══ MY PAGE ══ */
.me-banner{background:linear-gradient(135deg,var(--navy-d) 0%,var(--navy) 60%,#5a7a9a 100%);border-radius:var(--r2);position:relative;overflow:hidden;box-shadow:var(--s3)}
.me-banner-pat{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:30px 30px;pointer-events:none}
.me-banner-glow{position:absolute;width:240px;height:240px;border-radius:50%;filter:blur(56px);background:var(--teal);opacity:.2;top:-80px;right:60px;pointer-events:none}
.me-banner-top{padding:26px 28px 68px;position:relative;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.me-av{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--teal),#1e6e54);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#fff;border:3px solid rgba(255,255,255,.2);flex-shrink:0}
.me-name{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.4px;margin-bottom:5px}
.me-badges{display:flex;gap:7px;flex-wrap:wrap}
.me-badge{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:99px}
.mb-teal{color:var(--teal);background:rgba(42,138,110,.2);border:1px solid rgba(42,138,110,.4)}
.mb-navy{color:#a8c0e8;background:rgba(100,140,200,.2);border:1px solid rgba(100,140,200,.4)}
.mb-gold{color:#f0c840;background:rgba(240,200,64,.15);border:1px solid rgba(240,200,64,.3)}
.me-tabs-bar{position:absolute;bottom:0;left:0;right:0;display:flex;border-top:1px solid rgba(255,255,255,.1)}
.me-tab{flex:1;padding:12px 8px;font-size:12px;font-weight:500;color:rgba(255,255,255,.45);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:.01em;transition:all .15s}
.me-tab:hover{color:rgba(255,255,255,.8)}
.me-tab.on{color:#fff;border-bottom-color:rgba(255,255,255,.8)}
.me-grid{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.me-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.me-stat{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);padding:18px;text-align:center}
.me-stat-v{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.5px;margin-bottom:3px}
.me-stat-l{font-size:11px;color:var(--ink3)}
.order-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.order-item:last-child{border-bottom:none}
.oi-upcoming{background:var(--teal-ll);border-radius:var(--r);padding:12px;border:1px solid var(--teal-b);margin-bottom:8px}
.oi-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.oi-t{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:1px}
.oi-m{font-size:12px;color:var(--ink3)}
.ostatus{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.os-up{background:var(--teal-l);color:var(--teal)}
.os-done{background:var(--navy-l);color:var(--ink3)}
.os-recur{background:var(--navy-l);color:var(--navy-ink)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.toggle-lbl{flex:1;margin-right:12px}
.tsw{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0}
.tsw input{opacity:0;width:0;height:0}
.tknob{position:absolute;inset:0;background:var(--border2);border-radius:99px;cursor:pointer;transition:background .2s}
.tknob::before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tsw input:checked+.tknob{background:var(--teal)}
.tsw input:checked+.tknob::before{transform:translateX(17px)}
.cert-detail-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.cert-detail-row:last-child{border-bottom:none}
.cdr-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pif{background:var(--warm);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.pif-l{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.pif-v{font-size:13px;font-weight:600;color:var(--ink)}
.avail-day{border-radius:7px;padding:7px 4px;text-align:center;cursor:pointer;border:1px solid var(--border);background:var(--white);transition:all .15s;font-size:11px;font-weight:600}
.avail-day.on{background:var(--teal-l);border-color:var(--teal);color:var(--teal)}
.avail-day.off{background:var(--warm);color:var(--ink4)}
.wallet-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.wallet-row:last-child{border-bottom:none}
/* weight tracking */
.weight-entry{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px}
.weight-entry.latest{background:var(--teal-ll);border-color:var(--teal-b)}
.vax-table{background:var(--warm);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.vax-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.vax-row:last-child{border-bottom:none}
.vax-status{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.vs-ok{background:var(--teal-l);color:var(--teal)}
.vs-warn{background:var(--amber-l);color:var(--amber-ink)}
.vs-due{background:var(--coral-l);color:var(--coral)}
.tl-item{display:flex;gap:12px;padding:0 0 14px}
.tl-dot-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:20px}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--teal);flex-shrink:0;margin-top:3px}
.tl-line{flex:1;width:2px;background:var(--border);margin-top:3px}
.tl-date{font-size:11px;color:var(--ink3);font-weight:600;margin-bottom:2px}
.tl-desc{font-size:13px;color:var(--ink2)}
.credit-ring{width:64px;height:64px;border-radius:50%;border:3px solid var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}

/* ══ JOIN ══ */
.join-outer{max-width:520px;margin:0 auto;padding:40px 24px}
.join-card{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);padding:32px;box-shadow:var(--s2)}
.prog{display:flex;gap:4px;margin-bottom:22px}
.pd{height:3px;flex:1;border-radius:99px;background:var(--border)}
.pd.done{background:var(--teal)}
.jey{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--teal);text-transform:uppercase;margin-bottom:5px}
.jt{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:5px;letter-spacing:-.3px}
.jd{font-size:14px;color:var(--ink3);margin-bottom:20px;line-height:1.7}
.fg{margin-bottom:13px}
.fl{font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:5px;display:block;letter-spacing:.04em;text-transform:uppercase}
.fi{width:100%;padding:10px 13px;border-radius:9px;border:1px solid var(--border2);font-size:14px;color:var(--ink);background:var(--white);transition:border-color .15s}
.fi:focus{outline:none;border-color:var(--teal)}
.upbox{border:1.5px dashed var(--border2);border-radius:9px;padding:22px;text-align:center;background:var(--warm);font-size:13px;color:var(--ink3);cursor:pointer;transition:all .15s}
.upbox:hover{border-color:var(--teal);background:var(--teal-ll)}
.cg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:5px}
.cbtn{padding:10px;border-radius:9px;border:1px solid var(--border2);background:var(--white);font-size:13px;color:var(--ink2);text-align:center;font-weight:500;transition:all .15s}
.cbtn.sel{background:var(--teal-l);border-color:var(--teal);color:var(--teal-ink);font-weight:700}
.svc-cg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}
.sopt{padding:10px 13px;border-radius:9px;border:1px solid var(--border2);cursor:pointer;font-size:13px;color:var(--ink2);font-weight:500;transition:all .15s}

程提供保障。目前还没有可以投保的方案。", "ins_items": [{"t": "第三方责任", "p": "服务中宠物造成他人人身或财产损失时的赔偿。"}, {"t": "宠物意外医疗", "p": "服务期间宠物意外受伤的医疗费用。"}, {"t": "走失应急", "p": "服务中宠物走失时的寻找支持。"}], "ins_note": "以上是正在洽谈的保障方向，不是已经生效的保险。方案确定之前，宠邻不提供任何保险保障，也不作任何赔付承诺。方案上线后，投保会跳转到保险机构的页面，由保险机构负责承保和理赔。", "about_ey": "About", "about_t": "关于宠邻", "about_secs": [{"h": "宠邻是什么", "p": ["宠邻（PetNeighbor）是一个邻里宠物照护社区。宠物主出门、加班或短期出差时，可以请同小区经过核验和培训的邻居上门喂养或代遛狗。"]}, {"h": "为什么是邻居", "p": ["邻居离得近，能按时上门，也更容易先见面、建立信任。宠邻要做的，是给这种信任加上一套看得见的规则：实名核验、培训考核、照片打卡、双向评价。"]}, {"h": "现在做到哪一步", "p": ["宠邻目前在中国大陆的首批社区试运营，只开放上门喂养和代遛狗两项服务。账号系统、线上支付和保险仍在开发中，试运营期间的报名、核验和沟通都通过微信进行。"]}, {"h": "社区公益金", "p": ["有偿服务的 10% 计入社区公益金，用于社区流浪动物的救治和公益活动，每一笔收支都会在「社区公益金」页公示。"]}], "contact_ey": "Contact", "contact_t": "联系我们", "contact_sub": "试运营期间，报名、咨询、客服和合作都通过微信进行。", "contact_items": [{"t": "报名与咨询", "p": "添加宠邻微信，备注「宠邻报名」或「咨询」。"}, {"t": "在线客服", "p": "服务中遇到问题、需要投诉或申诉，添加微信后备注「客服」。"}, {"t": "合作", "p": "保险机构、动物医院、社区物业等合作，添加微信后备注「合作」。"}], "doc_draft": "草案：本文件为试运营期起草版本，正式上线前须经律师审阅。【】内为待填写的信息。", "doc_updated": "最近更新：2026 年 9 月 · 生效日期：【待定】", "doc_back": "← 返回", "agree_html": "我已阅读并同意<a class=\"inl\" onclick=\"pg('terms')\">《用户服务协议》</a><a class=\"inl\" onclick=\"pg('privacy')\">《隐私政策》</a><a class=\"inl\" onclick=\"pg('disclaimer')\">《服务免责声明》</a>", "agree_need": "请先阅读并勾选同意相关协议。", "terms_t": "用户服务协议", "terms_secs": [{"h": "一、协议双方与适用范围", "p": ["本协议由【运营主体名称】（以下称「宠邻」）与使用宠邻网站及服务的用户订立。报名即表示你已阅读并同意本协议、《隐私政策》和《服务免责声明》。", "试运营期间，宠邻只在中国大陆的首批社区提供上门喂养和代遛狗两项服务。"]}, {"h": "二、宠邻的角色", "p": ["宠邻负责服务者的核验、培训考核、双方匹配、服务记录的规则制定和纠纷协助。具体的喂养、遛狗服务由服务者提供。"]}, {"h": "三、用户资格与实名核验", "p": ["用户须年满 18 周岁，具有完全民事行为能力。", "用户须如实提供身份和联系信息，并配合宠邻团队通过视频通话完成实名核验，登记一位紧急联系人。信息不实的，宠邻有权拒绝或终止服务。"]}, {"h": "四、服务者的义务", "p": ["通过全部 10 题的培训考核后，方可提供服务。", "每次服务须在到达、服务中、离开三个节点发送照片打卡；遛狗全程使用牵引绳；不得喂食宠物主未指定的食物。", "发生宠物受伤、走失、伤人或健康异常时，须立即通知宠物主和宠邻团队，并如实报告经过。", "对服务中获知的宠物主个人信息和家庭情况严格保密，只用于本次服务。"]}, {"h": "五、宠物主的义务", "p": ["如实填写宠物档案，包括疫苗接种、性格特点（如护食、攻击性）、过敏史和病史，并按当地规定为宠物接种狂犬病疫苗。", "提供服务所需的安全环境和物品，如牵引绳、粮食和钥匙交接方式。", "因隐瞒或错报宠物情况造成的后果，由宠物主承担。"]}, {"h": "六、费用规则", "p": ["服务分为公益服务和有偿服务两种。公益服务不收取费用；有偿服务按服务者在宠邻登记的价格执行。", "双方不得私下议价，不得私下收付款，不得绕开宠邻私下约定服务。", "有偿服务费用的 10% 计入社区公益金。试运营期间尚无线上支付，付款方式由宠邻团队在微信上与双方书面确认。", "正式上线前，宠邻将设置每项服务的价格上限，不设下限。"]}, {"h": "七、预约的变更与取消", "p": ["需要变更或取消已确认的服务时，应尽早通知对方和宠邻团队，最迟不晚于服务开始前【  】小时。", "【请补充：临时取消的处理方式，以及对多次临时取消的处理】"]}, {"h": "八、评价规则", "p": ["服务结束后双方互评。评价须基于真实服务经历，不得刷评、诱导评价或恶意差评。评价会计入服务者的信任等级。"]}, {"h": "九、违规处理", "p": ["违反本协议的，宠邻可视情节采取提醒、警告、暂停服务或终止合作等措施。私下收付款、隐瞒意外、泄露他人信息属于严重违规。"]}, {"h": "十、责任", "p": ["服务过程中的风险与责任划分，见《服务免责声明》。宠邻会在纠纷中协助调取打卡记录、组织双方沟通。"]}, {"h": "十一、协议的变更与终止", "p": ["宠邻可以根据运营需要修改本协议，修改后会在本网站公布并通过微信通知。你可以随时通过微信联系宠邻团队退出。"]}, {"h": "十二、争议解决", "p": ["本协议适用中华人民共和国法律。发生争议时，双方应先友好协商；协商不成的，提交【运营主体所在地】有管辖权的人民法院处理。"]}, {"h": "十三、联系方式", "p": ["对本协议有任何疑问，请见「联系我们」页，通过微信联系宠邻团队。"]}], "privacy_t": "隐私政策", "privacy_secs": [{"h": "一、我们是谁", "p": ["本政策由【运营主体名称】（以下称「宠邻」）制定，说明宠邻如何处理你的个人信息。个人信息处理的相关事宜，你可以通过「联系我们」页的微信与我们联系。", "我们依照《中华人民共和国个人信息保护法》等法律法规处理个人信息。"]}, {"h": "二、本网站本身不收集个人信息", "p": ["本网站没有账号系统，不向任何服务器上传你填写的内容。", "报名页生成的报名信息只在你的浏览器中生成，由你自己复制后通过微信发给我们。", "「我的」页中的宠物档案、体重和疫苗记录，以及语言设置，只保存在你当前设备的浏览器本地存储中，宠邻无法读取。清除浏览器数据或更换设备后，这些记录会消失。", "本网站托管在境外平台，但如上所述，网站本身不收集或传输你的个人信息。"]}, {"h": "三、通过微信报名和核验时收集的信息", "p": ["称呼、微信号、所在城市和小区、身份（宠物主或服务者）、宠物信息、需要或提供的服务，以及服务者登记的价格。", "紧急联系人的姓名和联系方式。", "视频核验时，我们会查看你的身份证件以核对身份。身份证件信息属于敏感个人信息，我们会在核验前单独征得你的同意。【请补充：是否留存证件信息；如留存，留存哪些字段、保存多久】", "服务过程中产生的打卡照片、服务时间和评价。照片可能包含门牌等位置信息。"]}, {"h": "四、我们如何使用这些信息", "p": ["核验身份和服务者资格；为宠物主和服务者匹配；安排和记录服务；处理投诉、纠纷和紧急情况；公示社区公益金收支（公示内容不包含可识别个人身份的信息）。", "我们不会将你的个人信息用于上述目的之外的用途，除非另行征得你的同意。"]}, {"h": "五、我们如何共享信息", "p": ["匹配成功后，我们会向服务的另一方提供完成服务所必需的信息，例如称呼、小区、宠物档案和联系方式。", "我们不会出售你的个人信息。除法律法规要求或为保护人身、财产安全所必需外，不会向其他第三方提供。"]}, {"h": "六、保存期限", "p": ["我们只在实现上述目的所必需的期间内保存你的信息。【请补充：各类信息的具体保存期限】你退出宠邻后，我们会删除或匿名化处理你的个人信息，法律法规另有规定的除外。"]}, {"h": "七、你的权利", "p": ["你有权查阅、复制、更正、补充和删除你的个人信息，有权撤回同意，也有权要求退出并注销。请通过微信联系我们，我们会在【  】个工作日内处理。"]}, {"h": "八、未成年人", "p": ["宠邻的服务只面向年满 18 周岁的用户。我们不会主动收集未成年人的个人信息。"]}, {"h": "九、政策的更新", "p": ["本政策如有更新，我们会在本网站公布，并通过微信通知已报名的用户。涉及重要变化的，会再次征得你的同意。"]}], "discl_t": "服务免责声明", "discl_secs": [{"h": "一、试运营性质", "p": ["宠邻目前处于试运营阶段，功能和流程仍在完善中，部分功能标注为「规划中」，尚未上线。请以本网站各页面标注的状态为准。"]}, {"h": "二、核验和培训的范围", "p": ["宠邻对服务者进行实名核验和培训考核，这些措施可以降低风险，但不能保证服务者的每一次行为都没有差错。宠物主应在首次服务前与服务者见面，自行判断是否委托。"]}, {"h": "三、宠物自身的风险", "p": ["宠物可能因疾病、应激、年龄或性格发生意外。宠物主未如实披露宠物的健康状况、攻击性或特殊需要，由此造成的损失由宠物主承担。"]}, {"h": "四、服务中的意外", "p": ["服务中发生意外时，责任按照法律规定和事实情况认定。宠邻会协助调取打卡记录、组织双方沟通，但不是服务的直接提供方，不承担法律规定之外的赔偿责任。"]}, {"h": "五、保险", "p": ["宠邻目前不提供任何保险保障，也不作任何赔付承诺。保险方案上线后，由保险机构负责承保和理赔。"]}, {"h": "六、公益服务", "p": ["公益服务同样适用本声明和《用户服务协议》中的各项规则。"]}, {"h": "七、第三方服务", "p": ["试运营期间的沟通通过微信进行。微信的服务由其运营方提供，适用其自身的规则。"]}, {"h": "八、紧急情况", "p": ["宠邻试运营期间没有 7×24 小时值守。遇到紧急情况，服务者应先联系宠物主，必要时直接带宠物就近就医，并尽快通知宠邻团队。"]}], "ft_about": "关于", "ft_about_us": "关于宠邻", "ft_contact_us": "联系我们", "ft_terms": "用户服务协议", "ft_privacy": "隐私政策", "ft_discl": "服务免责声明", "ft_cs": "微信客服", "ft_badges": ["实名核验", "培训考核", "照片打卡", "双向评价", "10% 社区公益金"], "btn_login": "登录", "login_t": "账号系统尚未开放", "login_d": "宠邻正在试运营，账号登录还没有上线。现在请通过微信报名，报名后由团队为你完成核验。", "login_btn": "去报名", "home_carers_t": "精选服务者", "home_carers_lk": "查看全部", "sos_t": "服务中遇到紧急情况", "sos_d": "宠物受伤、走失或突发疾病时，先联系宠物主，必要时直接就近就医，再通知宠邻团队。", "sos_btn": "查看紧急处理指引"}, "en": {"doc_title": "PetNeighbor · Neighbourhood pet care", "brand": "PetNeighbor", "brand_full": "PetNeighbor 宠邻", "tagline": "Neighbourhood pet care · Pilot now recruiting", "btn_join": "Join", "nav_home": "Home", "nav_hiw": "How it works", "nav_trust": "Trust & Safety", "nav_charity": "Community Fund", "nav_join": "Sign up", "nav_me": "My Page (preview)", "hero_eyebrow": "Pilot · Recruiting our first neighbourhoods", "hero_h1": "Find a neighbour you trust<br>to <em>care</em> for your pet", "hero_desc": "PetNeighbor is a neighbourhood pet-care community for pet owners. Every carer passes an identity check and a 10-question training test, and every visit is logged with photo check-ins. Sign-ups for our first group are now open.", "hero_cta1": "Sign up on WeChat", "hero_cta2": "See how it works", "hc_title": "Pilot in progress", "hc_r1": "Recruiting pet owners and carers", "hc_r2": "Services: home feeding · dog walking", "hc_r3": "Tell us your city and neighbourhood", "hc_r4": "Free to join during the pilot", "pilot_t": "About the pilot", "pilot_d": "PetNeighbor is in its pilot phase, starting with neighbourhoods in mainland China, and offers two services only: home feeding and dog walking. Accounts, online payment and insurance are still being built, so during the pilot, sign-up, identity checks and messaging all happen on WeChat. Short-term boarding will open in a later phase.", "avail_ey": "Now Available", "avail_t": "What you can do today", "avail_sub": "Each item shows its status: “Available” means we already do it during the pilot; “Planned” means it isn't live yet.", "badge_on": "Available", "badge_plan": "Planned", "status": [{"on": true, "t": "Identity check", "p": "After you sign up, our team checks your ID on a video call. This website never collects ID photos or ID numbers."}, {"on": true, "t": "Carer training test", "p": "To become a carer, pass the 10-question test on the Trust & Safety page. Every answer must be correct."}, {"on": true, "t": "Photo check-ins", "p": "On every visit the carer sends the owner photos on WeChat at three points: arrival, feeding or walking, and locking up on the way out."}, {"on": true, "t": "Pet health record", "p": "Log your pet's weight and vaccine dates on My Page and get a flag 30 days before anything is due. The data stays on your own device."}, {"on": false, "t": "Online booking & payment", "p": "Opens once accounts launch. During the pilot, paid visits are charged at the price the carer has registered with PetNeighbor, and the team confirms the payment method with both sides in writing on WeChat."}, {"on": false, "t": "Pet insurance", "p": "We're in talks with insurers. Until a plan is confirmed, PetNeighbor makes no promise of cover."}], "hiw_ey": "How It Works", "hiw_t": "How PetNeighbor works", "see_all": "See all steps", "hiw_sub": "During the pilot, a real person on our team follows up at every step.", "hiw": [{"t": "Sign up", "p": "Add PetNeighbor on WeChat and tell us whether you're a pet owner, a carer or both, plus your city and neighbourhood."}, {"t": "Identity check", "p": "Our team video-calls you to check your ID and contact details, and records an emergency contact."}, {"t": "Pet profile", "p": "Owners share vaccine records, temperament (for example food guarding or shyness), allergies and their usual vet. Carers must read it before accepting."}, {"t": "Meet first", "p": "Before the first visit, you meet so the carer can get to know the pet and you can agree on the tasks. Paid visits are charged at the carer's registered price, with no further negotiation."}, {"t": "Visit & check-ins", "p": "The carer sends photos on arrival, during the visit and on leaving, so the owner always knows how things are going."}, {"t": "Two-way reviews", "p": "After the visit you review each other, and reviews count toward the carer's trust level."}], "fee_t": "About fees", "fee_d": "PetNeighbor has two kinds of visit: community visits, which are free, and paid visits, where each carer sets their own price for each service on the platform and owners book at that listed price. Owners and carers may not negotiate prices or exchange payment privately. There is no online payment during the pilot: carers register their prices when they sign up, and the PetNeighbor team confirms the payment method with both sides in writing on WeChat. 10% of every paid visit goes to the Community Fund.", "rec_t": "Recruiting our first carers", "rec_d": "We're just getting started, so no carers are listed yet. If you've kept pets, live in the neighbourhood and would like to help look after your neighbours' animals, sign up to be one of our first carers.", "rec_btn": "Become a carer", "trust_ey": "Trust & Safety", "trust_t": "Trust & Safety", "trust_sub": "During the pilot, our safety measures are mostly run by people. Here is what we already do and what is still planned.", "em_t": "If something goes wrong during a visit", "em_d": "The carer contacts the owner right away. If the owner can't be reached, contact the PetNeighbor team on WeChat and, if needed, take the pet to the nearest vet. There is no 24/7 on-call team during the pilot, so agree on emergency contacts when you first meet.", "lvl_t": "Trust levels", "levels": [{"n": "New neighbour", "d": "Identity check completed"}, {"n": "Community neighbour", "d": "Passed the training test, 5+ visits and an average rating of 4.5★ or higher"}, {"n": "Guardian", "d": "20+ visits and an average rating of 4.8★ or higher"}], "quiz_ey": "Training", "quiz_t": "Carer training test", "quiz_d": "10 questions. You must get every one right: a single wrong answer ends the test and you start again. The answer order is shuffled on every attempt.", "qz_of": "Question {n} of {t}", "qz_rule": "one wrong answer ends the test", "qz_fail_t": "Not passed", "qz_fail_d": "Question {n} was wrong, so the test has ended. You need all 10 correct to pass.", "qz_retry": "Start again", "qz_pass_t": "Passed", "qz_pass_d": "All 10 correct. This page doesn't record your result, so tell our team you've passed when you sign up and we'll check it with you during your identity call.", "quiz": [{"q": "A pet vomits after eating. What should you do?", "opts": ["Keep feeding and watch for a while", "Take photos right away and contact the owner", "Report it after the visit", "Ignore it and carry on"], "ans": 1, "exp": "Vomiting can signal a serious problem. Record it and tell the owner immediately."}, {"q": "Which check-ins are required on a feeding visit?", "opts": ["Just a photo of the pet", "Arrival (door + pet), a feeding record, and confirming the door is locked on departure", "Only the arrival time", "Whatever you like"], "ans": 1, "exp": "All three are required: proof of arrival, a record of the care, and a safe departure."}, {"q": "Without the owner's permission, which of these is forbidden?", "opts": ["Giving the food the owner specified", "Giving any food the owner didn't specify", "Changing the water", "Taking photos while feeding"], "ans": 1, "exp": "Pets may have allergies or diet restrictions; unapproved food can make them ill."}, {"q": "A pet goes missing. What should you do?", "opts": ["Wait for it to come back", "Tell the owner and the PetNeighbor team immediately", "Look on your own first", "Say nothing for now"], "ans": 1, "exp": "A missing pet needs many people searching at once; every delay lowers the chance of finding it."}, {"q": "On a walk, the dog bites a passer-by. What should you do?", "opts": ["Pretend you didn't see", "Help the injured person, tell the owner and report it honestly", "Leave it for the owner to handle", "Walk away quietly"], "ans": 1, "exp": "The carer is responsible for safety during the visit and must report any incident honestly and at once."}, {"q": "On a dog walk, which of these is required?", "opts": ["The lead can come off", "Keep the lead on the whole time and stay out of restricted areas", "Take whatever route you like", "No need to report afterwards"], "ans": 1, "exp": "The lead is the basic safety rule and stays on throughout; send check-in photos after the walk."}, {"q": "The pet profile says “food guarding”. What does that mean?", "opts": ["The pet loves food", "Don't approach or disturb it while it eats, or it may bite", "You can feed it any time", "It has a big appetite"], "ans": 1, "exp": "A food-guarding pet may bite while eating. Put the food down and step away."}, {"q": "A pet is listless and won't eat or drink. What should you do?", "opts": ["Assume it's normal and carry on", "Record it, contact the owner right away and suggest a vet", "Wait a few hours", "It's not part of the job"], "ans": 1, "exp": "Lethargy and refusing food are warning signs; the owner needs to know now."}, {"q": "What may you do with the owner's contact det and promises no compensation. Once a plan is available, you'll be taken to the insurer's own page to buy it, and the insurer will handle cover and claims.", "about_ey": "About", "about_t": "About PetNeighbor", "about_secs": [{"h": "What PetNeighbor is", "p": ["PetNeighbor is a neighbourhood pet-care community. When pet owners go out, work late or travel for a few days, they can ask a verified, trained neighbour to come in to feed their pet or walk their dog."]}, {"h": "Why neighbours", "p": ["Neighbours live close by, can arrive on time and can meet you first to build trust. PetNeighbor adds visible rules to that trust: identity checks, a training test, photo check-ins and two-way reviews."]}, {"h": "Where we are now", "p": ["PetNeighbor is running a pilot in its first neighbourhoods in mainland China, with two services only: home feeding and dog walking. Accounts, online payment and insurance are still being built, so during the pilot sign-up, checks and messaging all happen on WeChat."]}, {"h": "The Community Fund", "p": ["10% of every paid visit goes to the Community Fund for stray-animal care and community projects, and every transaction is published on the Community Fund page."]}], "contact_ey": "Contact", "contact_t": "Contact us", "contact_sub": "During the pilot, sign-ups, questions, support and partnerships are all handled on WeChat.", "contact_items": [{"t": "Sign-ups & questions", "p": "Add PetNeighbor on WeChat with the note “sign-up” or “question”."}, {"t": "Support", "p": "For problems during a visit, complaints or appeals, add us on WeChat with the note “support”."}, {"t": "Partnerships", "p": "Insurers, vet clinics and property managers: add us on WeChat with the note “partnership”."}], "doc_draft": "Draft: this document was written for the pilot and must be reviewed by a lawyer before the formal launch. Items in [ ] are still to be filled in.", "doc_updated": "Last updated: September 2026 · Effective date: [to be set]", "doc_back": "← Back", "agree_html": "I have read and agree to the <a class=\"inl\" onclick=\"pg('terms')\">Terms of Service</a>, <a class=\"inl\" onclick=\"pg('privacy')\">Privacy Policy</a> and <a class=\"inl\" onclick=\"pg('disclaimer')\">Service Disclaimer</a>", "agree_need": "Please read and tick the box to agree first.", "terms_t": "Terms of Service", "terms_secs": [{"h": "1. Parties and scope", "p": ["These terms are between [operating entity] (“PetNeighbor”) and anyone who uses the PetNeighbor website and services. By signing up, you confirm that you have read and agree to these terms, the Privacy Policy and the Service Disclaimer.", "During the pilot, PetNeighbor offers only home feeding and dog walking, and only in its first neighbourhoods in mainland China."]}, {"h": "2. PetNeighbor's role", "p": ["PetNeighbor verifies and tests carers, matches owners with carers, sets the rules for recording visits and helps resolve disputes. The feeding and walking itself is provided by the carer."]}, {"h": "3. Eligibility and identity checks", "p": ["Users must be at least 18 and legally able to enter into agreements.", "Users must give accurate identity and contact details, complete an identity check with the PetNeighbor team over a video call, and name an emergency contact. PetNeighbor may refuse or end service if information is false."]}, {"h": "4. Carers' obligations", "p": ["Carers may only take visits after passing all 10 questions of the training test.", "On every visit, carers must send photo check-ins on arrival, during the visit and on leaving; keep dogs on a lead for the whole walk; and never give food the owner hasn't approved.", "If a pet is injured, goes missing, hurts someone or shows signs of illness, the carer must tell the owner and the PetNeighbor team immediately and give an honest account.", "Carers must keep owners' personal and household information confidential and use it only for the visit."]}, {"h": "5. Owners' obligations", "p": ["Owners must fill in the pet profile accurately, including vaccinations, temperament (such as food guarding or aggression), allergies and medical history, and keep rabies vaccination up to date as local rules require.", "Owners must provide a safe environment and what the visit needs, such as a lead, food and a way to hand over keys.", "Owners are responsible for any consequences of hiding or misstating their pet's condition."]}, {"h": "6. Fees", "p": ["Visits are either community visits, which are free, or paid visits, charged at the price the carer has registered with PetNeighbor.", "Owners and carers may not negotiate prices privately, exchange payment privately, or arrange visits privately around PetNeighbor.", "10% of each paid visit goes to the Community Fund. There is no online payment during the pilot, so the PetNeighbor team confirms the payment method with both sides in writing on WeChat.", "Before the formal launch, PetNeighbor will set a maximum price for each service. There will be no minimum."]}, {"h": "7. Changes and cancellations", "p": ["If you need to change or cancel a confirmed visit, tell the other side and the PetNeighbor team as early as possible, and at least [  ] hours before the visit.", "[To be added: how late cancellations are handled, including repeated ones]"]}, {"h": "8. Reviews", "p": ["Both sides review each other after the visit. Reviews must reflect a real visit; fake, solicited or retaliatory reviews are not allowed. Reviews count toward the carer's trust level."]}, {"h": "9. Breaches", "p": ["If these terms are breached, PetNeighbor may remind, warn, suspend or end its relationship with the user, depending on the seriousness. Private payments, hiding an incident and disclosing other people's information are serious breaches."]}, {"h": "10. Responsibility", "p": ["How risks and responsibilities are divided during visits is set out in the Service Disclaimer. In a dispute, PetNeighbor will help retrieve check-in records and arrange for both sides to talk."]}, {"h": "11. Changes and ending the agreement", "p": ["PetNeighbor may update these terms as the service develops. Updates will be posted on this website and announced on WeChat. You may leave at any time by contacting the PetNeighbor team on WeChat."]}, {"h": "12. Disputes", "p": ["These terms are governed by the laws of the People's Republic of China. If a dispute arises, both sides should first try to settle it through discussion; if that fails, it will be referred to the competent people's court in [operating entity's location]."]}, {"h": "13. Contact", "p": ["If you have any questions about these terms, contact the PetNeighbor team on WeChat via the Contact us page."]}], "privacy_t": "Privacy Policy", "privacy_secs": [{"h": "1. Who we are", "p": ["This policy is issued by [operating entity] (“PetNeighbor”) and explains how PetNeighbor handles your personal information. For any privacy matter, contact us on WeChat via the Contact us page.", "We handle personal information in accordance with the Personal Information Protection Law of the People's Republic of China and other applicable laws."]}, {"h": "2. This website itself collects no personal information", "p": ["This website has no accounts and does not upload anything you type to any server.", "The sign-up message is created in your browser; you copy it and send it to us on WeChat yourself.", "The pet record, weight and vaccine entries on My Page, and your language setting, are stored only in your current browser's local storage on your device. PetNeighbor cannot read them, and they will be lost if you clear your browser data or change device.", "This website is hosted on a platform outside mainland China, but as described above, the website itself does not collect or transmit your personal information."]}, {"h": "3. Information collected when you sign up and are verified on WeChat", "p": ["Your name, WeChat ID, city and neighbourhood, whether you're an owner or a carer, your pet's details, the services you need or offer, and carers' registered prices.", "Your emergency contact's name and contact details.", "During the video check we look at your ID document to confirm who you are. ID information is sensitive personal information, and we will ask for your separate consent before the check. [To be added: whether any ID details are kept; if so, which ones and for how long]", "Check-in photos, visit times and reviews created during visits. Photos may show location details such as a door number."]}, {"h": "4. How we use this information", "p": ["To verify identities and carers' eligibility; match owners with carers; arrange and record visits; handle complaints, disputes and emergencies; and publish the Community Fund's income and payouts (published records contain no information that identifies individuals).", "We will not use your personal information for any other purpose without asking for your consent."]}, {"h": "5. How we share information", "p": ["Once a match is made, we give the other side the information needed for the visit, such as your name, neighbourhood, pet profile and contact details.", "We do not sell personal information. We will not share it with any other third party unless required by law or needed to protect someone's safety or property."]}, {"h": "6. How long we keep it", "p": ["We keep your information only as long as needed for the purposes above. [To be added: retention periods for each type of information] When you leave PetNeighbor, we will delete or anonymise your personal information unless the law requires otherwise."]}, {"h": "7. Your rights", "p": ["You have the right to access, copy, correct, complete and delete your personal information, to withdraw your consent, and to leave and have your account closed. Contact us on WeChat and we will respond within [  ] working days."]}, {"h": "8. Minors", "p": ["PetNeighbor's services are only for users aged 18 or over. We do not knowingly collect personal information from minors."]}, {"h": "9. Updates to this policy", "p": ["If this policy changes, we will post the update on this website and notify signed-up users on WeChat. For significant changes, we will ask for your consent again."]}], "discl_t": "Service Disclaimer", "discl_secs": [{"h": "1. This is a pilot", "p": ["PetNeighbor is in its pilot phase. Features and processes are still being developed, and some features are marked “Planned” and are not live yet. The status shown on each page of this website is what applies."]}, {"h": "2. What checks and training cover", "p": ["PetNeighbor checks carers' identities and tests their training. These measures reduce risk but cannot guarantee that a carer will never make a mistake. Owners should meet the carer before the first visit and decide for themselves whether to go ahead."]}, {"h": "3. Risks from the pet itself", "p": ["Pets can have accidents because of illness, stress, age or temperament. If an owner does not accurately disclose their pet's health, aggression or special needs, the owner is responsible for any resulting loss."]}, {"h": "4. Incidents during visits", "p": ["If something goes wrong during a visit, responsibility is decided according to the law and the facts. PetNeighbor will help retrieve check-in records and arrange for both sides to talk, but it does not provide the visit itself and does not accept liability beyond what the law requires."]}, {"h": "5. Insurance", "p": ["PetNeighbor does not currently provide any insurance cover and makes no promise of compensation. Once an insurance plan is available, the insurer will handle cover and claims."]}, {"h": "6. Community visits", "p": ["Free community visits are covered by this disclaimer and by all the rules in the Terms of Service."]}, {"h": "7. Third-party services", "p": ["Messaging during the pilot takes place on WeChat, which is provided by its own operator under its own rules."]}, {"h": "8. Emergencies", "p": ["There is no 24/7 on-call team during the pilot. In an emergency, the carer should contact the owner first, take the pet straight to the nearest vet if needed, and tell the PetNeighbor team as soon as possible."]}], "ft_about": "About", "ft_about_us": "About PetNeighbor", "ft_contact_us": "Contact us", "ft_terms": "Terms of Service", "ft_privacy": "Privacy Policy", "ft_discl": "Service Disclaimer", "ft_cs": "WeChat support", "ft_badges": ["Identity checks", "Training test", "Photo check-ins", "Two-way reviews", "10% Community Fund"], "btn_login": "Log in", "login_t": "Accounts aren't open yet", "login_d": "PetNeighbor is in its pilot phase and account log-in isn't live yet. Please sign up on WeChat for now; our team will complete your identity check after you sign up.", "login_btn": "Go to sign-up", "home_carers_t": "Featured carers", "home_carers_lk": "See all", "sos_t": "Emergency during a visit", "sos_d": "If a pet is injured, goes missing or falls ill, contact the owner first, go to the nearest vet if needed, then tell the PetNeighbor team.", "sos_btn": "See emergency steps"}};
const QR_SRC='';            // 放入二维码：填 data:image/png;base64,... 或资源链接
const WECHAT_ID='';         // 放入微信号
const PRICE_CAP=null;       // 价格上限（元/次）。正式上线前填入数字即生效，例如 80；null = 暂不设上限。不设下限。
let LANG='zh-Hans';
const T=k=>(I18N[LANG]&&I18N[LANG][k]!==undefined)?I18N[LANG][k]:(I18N['zh-Hans'][k]||'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

function pickLang(){
  const saved=store('pn-lang');if(saved&&I18N[saved])return saved;
  const n=(navigator.language||'').toLowerCase();
  if(n.startsWith('zh'))return 'zh-Hans';
  return 'en';
}
function setLang(l){LANG=l;store('pn-lang',l);document.documentElement.lang=l;document.title=T('doc_title');
  document.querySelectorAll('.lsb').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  document.querySelectorAll('[data-ih]').forEach(e=>e.innerHTML=T(e.dataset.ih));
  document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=T(e.dataset.ip));
  renderAll();
}

/* status cards */
function renderStatus(id){const el=document.getElementById(id);if(!el)return;
  el.innerHTML=T('status').map(s=>`<div class="st-card"><span class="st-badge ${s.on?'st-on':'st-plan'}">${esc(s.on?T('badge_on'):T('badge_plan'))}</span><h3>${esc(s.t)}</h3><p>${esc(s.p)}</p></div>`).join('');}
function renderHiw(id,lim){const el=document.getElementById(id);if(!el)return;const a=T('hiw');
  el.innerHTML=(lim?a.slice(0,lim):a).map((s,i)=>`<div class="hiw-c"><div class="hiw-n">${i+1}</div><h3>${esc(s.t)}</h3><p>${esc(s.p)}</p></div>`).join('');}
function renderLevels(){const el=document.getElementById('lvl-rows');const ic=['◎','◈','◆'],bg=['var(--teal-l)','var(--navy-l)','var(--amber-l)'];
  el.innerHTML=T('levels').map((l,i)=>`<div class="lvl-row"><div class="lvl-ico" style="background:${bg[i]};color:var(--ink3)">${ic[i]}</div><div><div class="lvl-n">${esc(l.n)}</div><div class="lvl-d">${esc(l.d)}</div></div></div>`).join('');}
function renderFund(){document.getElementById('fund-steps').innerHTML=T('fund_steps').map(s=>`<div class="s3"><b>${esc(s.t)}</b><span>${esc(s.p)}</span></div>`).join('');}
function renderNext(){document.getElementById('next-steps').innerHTML=T('next_steps').map((s,i)=>`<div class="s3"><b>${i+1}. ${esc(s.t)}</b><span>${esc(s.p)}</span></div>`).join('');}

/* join form */
let ROLE=null,MODE=null;const SVC=new Set();
function renderChips(){
  document.getElementById('f-role').innerHTML=['owner','carer','both'].map(k=>`<button class="chip${ROLE===k?' sel':''}" onclick="ROLE='${k}';renderChips()">${esc(T('role_'+k))}</button>`).join('');
  document.getElementById('f-mode').innerHTML=['free','paid','either'].map(k=>`<button class="chip${MODE===k?' sel':''}" onclick="MODE='${k}';renderChips()">${esc(T('mode_'+k))}</button>`).join('');
  renderPrice();
  document.getElementById('f-svc').innerHTML=['feed','walk'].map(k=>`<button class="chip${SVC.has(k)?' sel':''}" onclick="SVC.has('${k}')?SVC.delete('${k}'):SVC.add('${k}');renderChips()">${esc(T('svc_'+k))}</button>`).join('');
}
function priceTip(){return PRICE_CAP?T('price_tip_cap').replace('{cap}',PRICE_CAP):T('price_tip')}
function clampPrice(e){if(e.value==='')return;let v=Math.max(0,Math.round(+e.value||0));if(PRICE_CAP&&v>PRICE_CAP)v=PRICE_CAP;e.value=v}
function renderPrice(){const show=ROLE==='carer'||ROLE==='both';document.getElementById('f-price-wrap').style.display=show?'block':'none';
  document.getElementById('f-price-tip').textContent=priceTip();document.getElementById('cr-price-tip').textContent=priceTip();
  document.querySelectorAll('#f-p-feed,#f-p-walk,.cr-price').forEach(e=>{if(PRICE_CAP)e.max=PRICE_CAP;e.onchange=()=>clampPrice(e)})}
function renderQR(){document.querySelectorAll('.qr-box').forEach(b=>b.innerHTML=QR_SRC?`<img src="${QR_SRC}" alt="WeChat QR">`:esc(T('qr_pending')));
  document.querySelectorAll('.qr-id').forEach(e=>e.textContent=WECHAT_ID?T('qr_id')+WECHAT_ID:T('qr_id_pending'));}
function makeMsg(){
  const ag=document.getElementById('f-agree');document.getElementById('agree-warn').style.display=ag.checked?'none':'block';if(!ag.checked)return;
  const v=id=>document.getElementById(id).value.trim()||T('m_blank');
  ['f-p-feed','f-p-walk'].forEach(id=>clampPrice(document.getElementById(id)));
  let price='';if(ROLE==='carer'||ROLE==='both'){const pf=document.getElementById('f-p-feed').value,pw=document.getElementById('f-p-walk').value;
    const parts=[];if(pf!=='')parts.push(T('svc_feed')+' ¥'+pf+T('per_visit'));if(pw!=='')parts.push(T('svc_walk')+' ¥'+pw+T('per_visit'));
    price='\n'+T('m_price')+(parts.length?parts.join(T('sep')):T('m_blank'));}
  const txt=T('m_tpl').replace('{name}',v('f-name')).replace('{area}',v('f-area'))
    .replace('{role}',ROLE?T('role_'+ROLE):T('m_blank')).replace('{pet}',v('f-pet'))
    .replace('{mode}',MODE?T('mode_'+MODE):T('m_blank')).replace('{svc}',SVC.size?[...SVC].map(k=>T('svc_'+k)).join(T('sep')):T('m_blank'))+price;
  document.getElementById('msg-out').textContent=txt;document.getElementById('msg-wrap').style.display='block';document.getElementById('copy-state').textContent='';}
function copyMsg(){const t=document.getElementById('msg-out').textContent,st=document.getElementById('copy-state');
  const fail=()=>{st.textContent=T('f_copy_fail');const r=document.createRange();r.selectNodeContents(document.getElementById('msg-out'));const s=getSelection();s.removeAllRanges();s.addRange(r);};
  try{navigator.clipboard.writeText(t).then(()=>st.textContent=T('f_copied'),fail)}catch(e){fail()}}

/* quiz: strict, options shuffled each attempt */
let CQ=0,failed=false,ORDER=[];
function shuffleAll(){ORDER=I18N['zh-Hans'].quiz.map(q=>{const a=q.opts.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a})}
function renderQuiz(){const Q=T('quiz'),n=Q.length;
  document.getElementById('quiz-prog').innerHTML=Q.map((_,i)=>`<div class="qp${i<CQ?(failed&&i===CQ-1?' wrong':' done'):''}"></div>`).join('');
  const sr=document.getElementById('quiz-score-row'),area=document.getElementById('quiz-area');
  if(failed){sr.innerHTML='';area.innerHTML=`<div class="quiz-fail"><div class="quiz-fail-title">${esc(T('qz_fail_t'))}</div><div class="quiz-fail-desc">${esc(T('qz_fail_d').replace('{n}',CQ))}</div><button class="jbtn jbtn-p" style="flex:none;padding:9px 24px" onclick="restartQuiz()">${esc(T('qz_retry'))}</button></div>`;return}
  if(CQ>=n){sr.innerHTML='';area.innerHTML=`<div style="text-align:center;padding:20px 0"><div style="font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px">${esc(T('qz_pass_t'))}</div><div style="font-size:13px;color:var(--ink3);line-height:1.7">${esc(T('qz_pass_d'))}</div></div>`;return}
  sr.innerHTML=`<div class="quiz-score"><span class="qs-label">${esc(T('qz_of').replace('{n}',CQ+1).replace('{t}',n))} · ${esc(T('qz_rule'))}</span><span class="qs-val">${CQ}/${n}</span></div>`;
  const q=Q[CQ];area.innerHTML=`<div class="quiz-q">${esc(q.q)}</div><div class="quiz-opts">${ORDER[CQ].map(i=>`<button class="qo" onclick="ansQ(${i})">${esc(q.opts[i])}</button>`).join('')}</div>`;}
function ansQ(i){const q=T('quiz')[CQ],ok=i===q.ans;
  document.querySelectorAll('.qo').forEach((b,pos)=>{b.disabled=true;const idx=ORDER[CQ][pos];if(idx===q.ans)b.classList.add('correct');else if(idx===i)b.classList.add('wrong')});
  const e=document.createElement('div');e.className='quiz-explain';e.textContent=(ok?'✓ ':'✗ ')+q.exp;document.getElementById('quiz-area').appendChild(e);
  setTimeout(()=>{if(!ok)failed=true;CQ++;renderQuiz()},ok?900:1400);}
function restartQuiz(){CQ=0;failed=false;shuffleAll();renderQuiz()}

/* pet record — stored on this device only */
let PET=store('pn-pet')||{info:{},weights:[],vax:[]};
function savePetStore(){store('pn-pet',PET)}
function loadPetForm(){const f=PET.info||{};['name','breed','birth','vet','notes'].forEach(k=>{const e=document.getElementById('p-'+k);if(e)e.value=f[k]||''})}
function savePet(){['name','breed','birth','vet','notes'].forEach(k=>PET.info[k]=document.getElementById('p-'+k).value.trim());savePetStore();
  const f=document.getElementById('pet-saved');f.textContent=T('p_saved');setTimeout(()=>f.textContent='',2000)}
function renderWeight(){const el=document.getElementById('weight-track'),w=PET.weights;
  if(!w.length){el.innerHTML=`<div style="font-size:13px;color:var(--ink3)">${esc(T('w_empty'))}</div>`;return}
  el.innerHTML=w.map((x,i)=>{const last=i===w.length-1;return `<div class="weight-entry${last?' latest':''}"><span style="font-size:13px;color:var(--ink2)">${esc(x.date)}</span><span style="display:flex;align-items:center;gap:10px"><span style="font-size:${last?15:13}px;font-weight:${last?800:600};color:${last?'var(--teal-ink)':'var(--ink)'}">${x.w} kg</span><button class="lnk" onclick="delW(${i})">${esc(T('del'))}</button></span></div>`}).join('')}
function addWeight(){const inp=document.getElementById('weight-input'),v=parseFloat(inp.value);if(!(v>0&&v<200))return;
  PET.weights.push({date:new Date().toISOString().slice(0,10),w:Math.round(v*10)/10});inp.value='';savePetStore();renderWeight()}
function delW(i){PET.weights.splice(i,1);savePetStore();renderWeight()}
function renderVax(){const el=document.getElementById('vax-table'),today=new Date(new Date().toISOString().slice(0,10));
  if(!PET.vax.length){el.innerHTML=`<div class="vax-row" style="color:var(--ink3)">${esc(T('v_empty'))}</div>`;return}
  el.innerHTML=PET.vax.map((v,i)=>{const d=(new Date(v.next)-today)/864e5;const st=d<0?'due':d<=30?'warn':'ok';
    return `<div class="vax-row"><div style="flex:1;font-weight:600;color:var(--ink)">${esc(v.name)}</div><div style="font-size:12px;color:var(--ink3)">${esc(T('v_next'))}${esc(v.next)}</div><span class="vax-status ${st==='ok'?'vs-ok':st==='warn'?'vs-warn':'vs-due'}">${esc(T('v_'+st))}</span><button class="lnk" onclick="delV(${i})">${esc(T('del'))}</button></div>`}).join('')}
function addVax(){const n=document.getElementById('v-name').value.trim(),d=document.getElementById('v-date').value;if(!n||!d)return;
  PET.vax.push({name:n,next:d});PET.vax.sort((a,b)=>a.next.localeCompare(b.next));document.getElementById('v-name').value='';document.getElementById('v-date').value='';savePetStore();renderVax()}
function delV(i){PET.vax.splice(i,1);savePetStore();renderVax()}

/* preview-only sample screens */
function renderSamples(){
  document.getElementById('bk-list').innerHTML=T('bk_items').map((b,i)=>`<div class="order-item${i===0?' oi-upcoming':''}"><div style="flex:1"><div class="oi-t">${esc(b.t)}</div><div class="oi-m">${esc(b.m)}</div></div><span class="ostatus ${i===0?'os-up':i===1?'os-recur':'os-done'}">${esc(b.s)}</span></div>`).join('');
  document.getElementById('carer-stats').innerHTML=T('cr_stats').map(s=>`<div class="me-stat"><div class="me-stat-v">${esc(s.v)}</div><div class="me-stat-l">${esc(s.l)} <span class="pv-tag">${esc(T('sample'))}</span></div></div>`).join('');
  const av=[1,1,0,1,0,1,1];document.getElementById('avail-grid').innerHTML=T('days').map((d,i)=>`<div class="avail-day ${av[i]?'on':'off'}"><div style="font-size:10px;color:var(--ink3);margin-bottom:2px">${esc(d)}</div><div style="font-size:11px">${esc(av[i]?T('av_on'):T('av_off'))}</div></div>`).join('');
}

function openLogin(){document.getElementById('login-modal').classList.add('open')}
function closeLogin(){document.getElementById('login-modal').classList.remove('open')}
function goEmerg(){pg('trust');setTimeout(()=>{const e=document.getElementById('emerg');if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},400)}
function renderHomeWait(){const sl=T('disc_slots');document.getElementById('home-wait').innerHTML=[0,1,2].map(i=>`<div class="wait-card" style="cursor:pointer" onclick="pg('disc')"><div class="wait-av">?</div><div><div class="wait-t">${esc(sl[i].t)} <span class="pv-tag">${esc(T('wait'))}</span></div><div class="wait-p">${esc(sl[i].p)}</div></div></div>`).join('')}
let DF='all';
function renderDisc(){
  document.getElementById('disc-filter').innerHTML=['all','feed','walk'].map(k=>`<button class="chip${DF===k?' sel':''}" onclick="DF='${k}';renderDisc()">${esc(k==='all'?T('disc_all'):T('svc_'+k))}</button>`).join('');
  const sl=T('disc_slots'),keep=DF==='all'?[0,1,2]:DF==='feed'?[0,2]:[1,2];
  document.getElementById('disc-grid').innerHTML=keep.map(i=>`<div class="wait-card"><div class="wait-av">?</div><div><div class="wait-t">${esc(sl[i].t)} <span class="st-badge st-plan" style="margin:0 0 0 6px">${esc(T('wait'))}</span></div><div class="wait-p">${esc(sl[i].p)}</div></div></div>`).join('');
  document.getElementById('disc-show').innerHTML=T('disc_show').map(x=>`<div class="st-card"><h3>${esc(x.t)}</h3><p>${esc(x.p)}</p></div>`).join('');}
function renderInsPage(){document.getElementById('ins-items').innerHTML=T('ins_items').map(x=>`<div class="st-card"><span class="st-badge st-plan">${esc(T('badge_plan'))}</span><h3>${esc(x.t)}</h3><p>${esc(x.p)}</p></div>`).join('')}
const secsHTML=secs=>secs.map(x=>`<h3>${esc(x.h)}</h3>${x.p.map(p=>`<p>${esc(p)}</p>`).join('')}`).join('');
function renderDocs(){
  document.getElementById('about-body').innerHTML=secsHTML(T('about_secs'));
  document.getElementById('contact-items').innerHTML=T('contact_items').map(x=>`<div class="s3"><b>${esc(x.t)}</b><span>${esc(x.p)}</span></div>`).join('');
  [['terms','terms_t','terms_secs'],['privacy','privacy_t','privacy_secs'],['disclaimer','discl_t','discl_secs']].forEach(([id,t,sec])=>{
    document.getElementById('doc-'+id).innerHTML=`<div class="sh"><div class="sh-ey">Legal</div><div class="sh-t">${esc(T(t))}</div><div class="doc-date">${esc(T('doc_updated'))}</div></div><div class="preview-note" style="margin:0 0 18px">${esc(T('doc_draft'))}</div>${secsHTML(T(sec))}`});
  document.getElementById('ft-badges').innerHTML=T('ft_badges').map(b=>`<div class="ftb">${esc(b)}</div>`).join('');}
function renderAll(){renderHomeWait();renderDisc();renderInsPage();renderDocs();renderStatus('home-status');renderStatus('trust-status');renderHiw('home-hiw',3);renderHiw('hiw-grid');renderLevels();renderFund();renderNext();renderChips();renderQR();renderQuiz();renderWeight();renderVax();renderSamples()}

function pg(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));document.getElementById('page-'+p).classList.add('on');
  document.querySelectorAll('.tn').forEach(e=>e.classList.remove('on'));const t=document.getElementById('tn-'+p);if(t){t.classList.add('on');t.scrollIntoView({block:'nearest',inline:'center'})}
  window.scrollTo({top:0,behavior:'smooth'})}
function setMeTab(t){document.querySelectorAll('.me-tab').forEach(b=>b.classList.remove('on'));['pet','book','carer'].forEach(k=>document.getElementById('metab-'+k).style.display='none');
  document.getElementById('met-'+t).classList.add('on');document.getElementById('metab-'+t).style.display='flex'}

shuffleAll();loadPetForm();setLang(pickLang());
</script>
